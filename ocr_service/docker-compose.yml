version: '3.8'

services:
  paddleocr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paddleocr_service
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
